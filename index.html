<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simutrans テクスチャ乗算合成・ペイントツール Web</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>
  <div id="app-container">
    <aside id="sidebar"></aside>

    <main id="canvas-container">
      <div id="zoom-toolbar">
        <button id="btn-zoom-out">－</button>
        <span id="lbl-zoom">100%</span>
        <button id="btn-zoom-in">＋</button>
        <button id="btn-zoom-reset">等倍 (100%)</button>
        <button id="btn-zoom-fit">全体表示 (Fit)</button>
        <span class="guide-text">中/右ドラッグ or Space+ドラッグ: スクロール | ホイール: 拡縮</span>
      </div>
      <div id="canvas-viewport">
        <canvas id="main-canvas"></canvas>
      </div>
      <footer id="status-bar">準備完了 | スポイト: OFF</footer>
    </main>
  </div>

  <div id="modal-container"></div>
  <input type="file" id="input-file-hidden" style="display: none;">

  <script>
    window.addEventListener('error', function(e) {
      const sb = document.getElementById('status-bar');
      if (sb) sb.innerHTML = '<span style="color:#ff6b6b; font-weight:bold;">エラー: ' + e.message + ' (' + (e.filename ? e.filename.split('/').pop() : '') + ':' + e.lineno + ')</span>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      const sb = document.getElementById('status-bar');
      if (sb) sb.innerHTML = '<span style="color:#ff6b6b; font-weight:bold;">非同期エラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</span>';
    });
  </script>
  <script type="module" src="./js/app.js" onerror="document.getElementById('status-bar').innerHTML='<span style=color:#ff6b6b;font-weight:bold>読込エラー: js/app.js または分割されたJSファイルが見つかりません</span>'"></script>
</body>
</html>
